<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title><!-- PORTFOLIO_TITLE --></title>
<meta name="description" content="<!-- PORTFOLIO_DESCRIPTION -->">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}
img{max-width:100%}
[hidden]:not([hidden=until-found i]){display:none!important}
</style>
<style>
/* Layout concept: a printed feature story. A wide serif headline, a narrow margin column
   for metadata, and long-form entries. Restrained: one accent, no effects beyond hover. */
:root {
  --bg: #F6F7F8;
  --surface: #FFFFFF;
  --ink: #12161B;
  --muted: #566070;
  --line: #D9DEE4;
  --accent: #0E5E52;
  --accent-ink: #FFFFFF;
  --mark: #DDEFEA;
  --font-display: 'Newsreader', Georgia, 'Times New Roman', serif;
  --font-body: 'Public Sans', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1317; --surface: #161B21; --ink: #ECEFF2; --muted: #9AA4B2;
    --line: #29313B; --accent: #5FCDB5; --accent-ink: #0F1317; --mark: #17332E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1317; --surface: #161B21; --ink: #ECEFF2; --muted: #9AA4B2;
  --line: #29313B; --accent: #5FCDB5; --accent-ink: #0F1317; --mark: #17332E;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 1rem; line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--bg);
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
h1, h2, h3, blockquote { font-family: var(--font-display); font-weight: 400; margin: 0; text-wrap: balance; }
p { margin: 0; }
ul, ol, dl, dd { margin: 0; padding: 0; }
ul, ol { list-style: none; }

.wrap {
  max-width: 1120px; margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.label { font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }

/* ---------- header ---------- */
.site-head {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--bg);
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.head-in { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 58px; }
.brand { font-family: var(--font-display); font-size: 1.3rem; font-weight: 500; text-decoration: none; letter-spacing: -0.01em; }
.nav { display: flex; align-items: center; gap: clamp(14px, 3vw, 30px); }
.nav a { text-decoration: none; font-size: 0.88rem; color: var(--muted); }
.nav a:hover { color: var(--ink); }
.nav a.cta { color: var(--ink); border-bottom: 1px solid var(--accent); padding-bottom: 1px; }
.icon-btn {
  display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%;
  border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer;
}
.icon-btn:hover { border-color: var(--ink); }
.icon-btn svg { width: 16px; height: 16px; }

/* ---------- masthead ---------- */
.masthead { padding-block: clamp(36px, 6vw, 80px) clamp(40px, 6vw, 72px); }
.mast-meta {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px;
  padding-bottom: 14px; border-bottom: 1px solid var(--ink);
}
.mast-meta .avail { color: var(--accent); }
.mast-meta .avail::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); margin-right: 8px; vertical-align: 1px; }
.headline {
  font-size: clamp(2.7rem, 8.2vw, 6.4rem); line-height: 0.98; letter-spacing: -0.025em; font-weight: 400;
  max-width: 15ch;
}
.headline em { font-style: italic; color: var(--accent); }
.mast-body { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: clamp(28px, 6vw, 88px); margin-top: clamp(32px, 5vw, 64px); align-items: start; }
.standfirst { font-family: var(--font-display); font-size: clamp(1.25rem, 2.3vw, 1.6rem); line-height: 1.4; max-width: 34em; }
.facts { border-top: 1px solid var(--line); }
.facts div { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.facts dt { padding-top: 3px; }
.facts dd { font-size: 0.95rem; overflow-wrap: anywhere; }
.hero-aside { display: grid; justify-items: end; gap: 20px; min-width: 0; }
.hero-photo-frame {
  justify-self: end; width: min(100%, 300px); aspect-ratio: 1;
  margin: 0; border: 1px solid var(--line); border-radius: 50%;
  padding: 8px; overflow: hidden; background: var(--surface);
}
.hero-photo {
  display: block; width: 100%; height: 100%; aspect-ratio: 1;
  border-radius: 50%; object-fit: cover; object-position: center;
}
.actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
.btn {
  display: inline-flex; align-items: center; text-decoration: none; font-weight: 500; font-size: 0.92rem;
  padding: 11px 20px; border: 1px solid var(--ink); border-radius: 2px; transition: background .15s, color .15s;
}
.btn.primary { background: var(--ink); color: var(--bg); }
.btn.primary:hover { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost:hover { background: var(--ink); color: var(--bg); }

/* ---------- sections ---------- */
.section { padding-block: clamp(48px, 7vw, 96px); border-top: 1px solid var(--ink); }
.section-grid { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 9fr); gap: clamp(20px, 5vw, 72px); }
.section-title { font-size: clamp(1.7rem, 3vw, 2.2rem); line-height: 1.1; letter-spacing: -0.01em; }
.section-aside { display: grid; gap: 8px; align-content: start; }
.section-aside .label { display: block; }

/* ---------- work ---------- */
.entry { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 9fr); gap: clamp(20px, 5vw, 72px); padding-block: clamp(28px, 4vw, 44px); border-top: 1px solid var(--line); }
.entry:first-child { border-top: 0; padding-top: 0; }
.entry:last-child { padding-bottom: 0; }
.entry-meta { display: grid; gap: 14px; align-content: start; }
.entry-meta dt { margin-bottom: 1px; }
.entry-meta dd { font-size: 0.92rem; overflow-wrap: anywhere; }
.entry h3 { font-size: clamp(1.9rem, 4.2vw, 3rem); line-height: 1.05; letter-spacing: -0.02em; }
.entry .deck { margin-top: 14px; font-family: var(--font-display); font-style: italic; font-size: 1.2rem; line-height: 1.4; color: var(--muted); max-width: 36em; }
.entry .copy { margin-top: 22px; max-width: 62ch; }
.entry .copy p + p { margin-top: 14px; }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px clamp(20px, 4vw, 48px); margin-top: 28px; }
.cols h4 { margin: 0 0 10px; font: 500 0.72rem var(--font-mono); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.cols li { padding: 8px 0; border-top: 1px solid var(--line); font-size: 0.95rem; }
.cols li:last-child { border-bottom: 1px solid var(--line); }
.note { margin-top: 22px; font-size: 0.88rem; color: var(--muted); max-width: 62ch; }
.tag { display: inline-block; padding: 1px 8px; margin-left: 6px; border-radius: 2px; background: var(--mark); color: var(--accent); font: 500 0.68rem var(--font-mono); letter-spacing: 0.06em; text-transform: uppercase; vertical-align: 2px; }

/* ---------- capabilities ---------- */
.caps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; }
.cap { padding: 0 clamp(16px, 3vw, 36px); min-width: 0; }
.cap:first-child { padding-left: 0; }
.cap + .cap { border-left: 1px solid var(--line); }
.cap h3 { font-size: 1.45rem; letter-spacing: -0.01em; margin-bottom: 14px; }
.cap li { padding: 9px 0; border-top: 1px solid var(--line); font-size: 0.95rem; }
.cap li small { display: block; color: var(--muted); font-size: 0.84rem; line-height: 1.45; }

/* ---------- about ---------- */
.pull { font-size: clamp(1.7rem, 3.8vw, 2.7rem); line-height: 1.18; letter-spacing: -0.015em; max-width: 22em; }
.pull em { color: var(--accent); }
.about-text { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px clamp(20px, 4vw, 48px); margin-top: clamp(28px, 4vw, 48px); color: var(--muted); max-width: 60rem; }
.about-text strong { color: var(--ink); font-weight: 600; }
.editorial-records { display: grid; margin-top: clamp(28px, 4vw, 48px); }
.editorial-record { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 9fr); gap: clamp(20px, 5vw, 72px); padding-block: 22px; border-top: 1px solid var(--line); }
.editorial-record h3 { font-size: clamp(1.35rem, 2.5vw, 1.8rem); }
.editorial-record p { margin-top: 6px; color: var(--muted); }

/* ---------- contact ---------- */
.contact-big { font-size: clamp(2.2rem, 6vw, 4.4rem); line-height: 1.02; letter-spacing: -0.025em; max-width: 14em; }
.contact-big em { color: var(--accent); }
.contact-sub { margin-top: 18px; color: var(--muted); max-width: 46ch; }
.c-list { margin-top: clamp(28px, 4vw, 44px); border-top: 1px solid var(--ink); }
.contact-row { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.contact-row .val { font-family: var(--font-display); font-size: clamp(1.15rem, 2.4vw, 1.5rem); overflow-wrap: anywhere; user-select: all; }
.copy-btn {
  appearance: none; background: transparent; border: 1px solid var(--line); border-radius: 2px;
  padding: 6px 12px; font: 500 0.72rem var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink); cursor: pointer; min-width: 84px;
}
.copy-btn:hover { border-color: var(--accent); color: var(--accent); }

.site-foot { border-top: 1px solid var(--ink); padding-block: 22px 40px; }
.foot-in { display: flex; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; }
.foot-in a { text-decoration: none; }
.foot-in a:hover { color: var(--accent); }

/* ---------- responsive ---------- */
@media (max-width: 900px) {
  .mast-body, .section-grid, .entry { grid-template-columns: minmax(0, 1fr); }
  .hero-aside { justify-items: center; }
  .hero-photo-frame { justify-self: center; }
  .facts { width: min(100%, 22rem); margin-inline: auto; }
  .entry .actions { justify-content: center; }
  .editorial-record { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .entry-meta { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .caps { grid-template-columns: minmax(0, 1fr); }
  .cap, .cap:first-child { padding: 0; }
  .cap + .cap { border-left: 0; margin-top: 32px; }
}
@media (max-width: 600px) {
  .nav a:not(.cta) { display: none; }
  .cols, .about-text { grid-template-columns: minmax(0, 1fr); }
  .contact-row { grid-template-columns: minmax(0, 1fr) auto; }
  .contact-row .label { grid-column: 1 / -1; }
  .facts div { grid-template-columns: 6rem minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .btn { transition: none; }
}
</style>

<!-- PORTFOLIO_HEADER -->

<main id="top">
  <!-- PORTFOLIO_MASTHEAD -->
  <!-- PORTFOLIO_PROJECTS -->
  <!-- PORTFOLIO_SKILLS -->
  <!-- PORTFOLIO_ABOUT -->
  <!-- PORTFOLIO_CONTACT -->
</main>

<footer class="site-foot">
  <div class="wrap foot-in">
    <span class="label"><!-- PORTFOLIO_FOOTER --></span>
    <a class="label" href="#top">Back to top &uarr;</a>
  </div>
</footer>

<script>
(function () {
  var root = document.documentElement;
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  var btn = document.getElementById('theme-btn');
  var SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  var MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';

  function effective() { return root.getAttribute('data-theme') || (mq.matches ? 'dark' : 'light'); }
  function paintBtn() {
    var dark = effective() === 'dark';
    btn.innerHTML = dark ? SUN : MOON;
    btn.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
  }
  try {
    var saved = localStorage.getItem('portfolio-editorial-theme');
    if (saved === 'dark' || saved === 'light') root.setAttribute('data-theme', saved);
  } catch (e) {}
  btn.addEventListener('click', function () {
    var next = effective() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('portfolio-editorial-theme', next); } catch (e) {}
    paintBtn();
  });
  if (mq.addEventListener) mq.addEventListener('change', paintBtn);
  paintBtn();

  Array.prototype.forEach.call(document.querySelectorAll('[data-copy]'), function (b) {
    b.addEventListener('click', function () {
      var done = function (ok) {
        b.textContent = ok ? 'Copied' : 'Selected';
        setTimeout(function () { b.textContent = 'Copy'; }, 1600);
      };
      var fallback = function () {
        try {
          var r = document.createRange();
          r.selectNodeContents(b.closest('.contact-row').querySelector('.val'));
          var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
        } catch (e) {}
        done(false);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(b.getAttribute('data-copy')).then(function () { done(true); }, fallback);
      } else { fallback(); }
    });
  });
})();
</script>

</body></html>
